services:

  # ── F1 Consumer (SQS → DynamoDB) ─────────────────────────────────────────
  # Polls f1_simulation_events, writes live state to DynamoDB.
  # LocalStack must already be running (start it via localstack/docker-compose.yml
  # or 'make bootstrap && make deploy' before running this stack).
  f1-consumer:
    build: ./observability/f1-consumer
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # host.docker.internal resolves to the host machine (where LocalStack runs)
      AWS_ENDPOINT_URL: http://host.docker.internal:4566
      SQS_QUEUE_NAME: f1_simulation_events
      LIVE_STATE_TABLE: f1_live_state
      SIMULATOR_STATE_TABLE: f1_simulator_state
      IDLE_TIMEOUT_SECONDS: "60"
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Metrics Exporter (DynamoDB → Prometheus /metrics) ────────────────────
  metrics-exporter:
    build: ./observability/metrics-exporter
    ports:
      - "8000:8000"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://host.docker.internal:4566
      LIVE_STATE_TABLE: f1_live_state
      SIMULATOR_STATE_TABLE: f1_simulator_state
      SESSIONS_TABLE: f1_sessions
      LAPS_TABLE: f1_laps
      SCRAPE_INTERVAL_SECONDS: "5"
      METRICS_PORT: "8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      - metrics-exporter
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/live-race.json
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
